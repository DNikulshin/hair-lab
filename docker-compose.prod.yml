# Прод-развёртывание на одном VPS: те же образы, что выпускает CI в GHCR.
#
# Локальная проверка с миграциями (образы из GHCR, порядок как в деплое):
#   export GHCR_IMAGE_API=ghcr.io/<owner>/hair-lab-api
#   export GHCR_IMAGE_WEB=ghcr.io/<owner>/hair-lab-web
#   export GHCR_IMAGE_MIGRATIONS=ghcr.io/<owner>/hair-lab-api-migrations
#   export IMAGE_TAG=<sha>
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml run --rm -T migrations
#   docker compose -f docker-compose.prod.yml up -d
#
# GHCR_IMAGE_MIGRATIONS обязателен при образах из GHCR. Локально его можно не экспортировать,
# если образ миграций собран под именем `hair-lab-api-migrations` (см. комментарий к сервису
# `migrations`).
name: hair-lab

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hair_lab}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Миграции схемы: короткоживущий job из стадии `migrations` того же Dockerfile и с тем же
  # тегом, что api. Профиль `migrations` держит сервис вне обычных `pull`/`up -d`; он поднимается
  # только при явном упоминании (`run --rm -T migrations`).
  #
  # Имя образа задаёт деплой: `GHCR_IMAGE_MIGRATIONS` пишется в `.env` на VPS из `release.yml`.
  # В локальной проверке переменную экспортировать не обязательно, если образ собран локально
  # под именем `hair-lab-api-migrations` (`docker build -f apps/api/Dockerfile --target
  # migrations -t hair-lab-api-migrations .`) — по умолчанию подставляется оно.
  # `:?` здесь намеренно нет: compose интерполирует переменные до фильтрации по профилям, и
  # обязательная переменная требовалась бы даже обычным `up -d`, который этот сервис не запускает.
  migrations:
    image: ${GHCR_IMAGE_MIGRATIONS:-hair-lab-api-migrations}:${IMAGE_TAG:-latest}
    profiles: ['migrations']
    # Перезапуск бессмысленен: упавшая миграция останавливает деплой, а не крутится в цикле.
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hair_lab}?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${GHCR_IMAGE_API:?задайте GHCR_IMAGE_API}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SALON_TIMEZONE: ${SALON_TIMEZONE:-Europe/Moscow}
      CORS_ORIGINS: ${CORS_ORIGINS:?задайте CORS_ORIGINS}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hair_lab}?schema=public
      # Базовый адрес для ссылок в письмах (вход по ссылке, подтверждение записи).
      APP_URL: ${APP_URL:-}
      # ЮKassa (issue #8): test до запуска, live только осознанно.
      PAYMENTS_MODE: ${PAYMENTS_MODE:-test}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-}
      YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-1}
      PAYMENT_RECEIPT_EMAIL: ${PAYMENT_RECEIPT_EMAIL:-}
      # Почта (issue #9): SMTP Яндекса или Google.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Стриж Lab}
    depends_on:
      db:
        condition: service_healthy
    # Только loopback: снаружи — nginx на хосте (deploy/nginx/hair-lab.conf.example).
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'

  web:
    image: ${GHCR_IMAGE_WEB:?задайте GHCR_IMAGE_WEB}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Серверные запросы Next.js к api внутри compose-сети (runtime, не build-arg).
      # Браузер по-прежнему ходит через NEXT_PUBLIC_API_URL и nginx.
      API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'

volumes:
  db-data:
