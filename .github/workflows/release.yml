name: Release

# Пайплайн выпуска: образы в GHCR, затем деплой на VPS.
# 1) push в main → образы с тегом sha и latest
# 2) тег v*.*.* → дополнительно версия
# 3) деплой выполняется, только если задана переменная репозитория DEPLOY_ENABLED=true
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  # Что изменилось: пересобираем только затронутые образы (scripts/changed-components.mjs).
  # Тег v*.*.*, workflow_dispatch, отсутствие базы для диффа — всегда оба образа.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
      any: ${{ steps.detect.outputs.any }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: node scripts/changed-components.mjs

  # По тегу проверяем, что релиз действительно собран из main (корректное слияние),
  # и прогоняем проверки заново — тег может указывать на старый коммит.
  verify-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Коммит тега должен быть в main
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Тег $GITHUB_REF_NAME указывает на коммит вне main — слияние некорректно, образы не публикуются."
            exit 1
          fi
      # Версия pnpm берётся из packageManager в package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hair-lab/contracts build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:arch
      - run: pnpm test

  images:
    needs: [verify-tag, changes]
    # Для push в main verify-tag пропускается — образы собираются как обычно.
    # Пустая матрица (docs-only push) не запускает ни одной сборки.
    #
    # Здесь job-level `if` оставлен сознательно: эти чеки НЕ являются required в branch
    # protection, поэтому пропуск никого не блокирует. Если `images` когда-нибудь попадёт
    # в required checks — перейти на статическую матрицу со step-level gate, как в ci.yml
    # (job `docker`): у пропущенного job'а не создаются чеки с именами вида
    # `images (api, …)`, и PR/деплой навсегда получит «Expected — Waiting for status».
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.any == 'true' && (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # Docker требует lowercase в имени образа, а github.repository содержит owner как есть.
      - name: Нормализовать имя образа
        run: echo "IMAGE_BASE=${IMAGE_BASE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать теги
        id: tags
        run: |
          IMAGE="${REGISTRY}/${IMAGE_BASE}-${{ matrix.component }}"
          TAGS="${IMAGE}:${{ github.sha }}"
          TAGS="${TAGS},${IMAGE}:latest"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "list=${TAGS}" >> "$GITHUB_OUTPUT"

      # NEXT_PUBLIC_* встраиваются в бандл на сборке, поэтому бренд передаётся build-arg'ами.
      # Для api шаг не выполняется — там `BUILD_ARGS` пустой.
      - name: Подготовить build-args (web)
        if: matrix.component == 'web'
        run: |
          {
            echo "BUILD_ARGS<<BUILD_ARGS_EOF"
            echo "NEXT_PUBLIC_SITE_NAME=${{ vars.NEXT_PUBLIC_SITE_NAME || 'Стриж Lab' }}"
            echo "NEXT_PUBLIC_SITE_SHORT_NAME=${{ vars.NEXT_PUBLIC_SITE_SHORT_NAME || 'Стриж' }}"
            echo "NEXT_PUBLIC_SITE_DESCRIPTION=${{ vars.NEXT_PUBLIC_SITE_DESCRIPTION || 'Салон красоты в Москве: услуги, мастера и онлайн-запись.' }}"
            echo "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://strizhlab.ru' }}"
            echo "NEXT_PUBLIC_SITE_CITY=${{ vars.NEXT_PUBLIC_SITE_CITY || 'Москва' }}"
            echo "NEXT_PUBLIC_SITE_TIMEZONE=${{ vars.NEXT_PUBLIC_SITE_TIMEZONE || 'Europe/Moscow' }}"
            echo "NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://strizhlab.ru/api' }}"
            echo "BUILD_ARGS_EOF"
          } >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: [images, changes]
    # Ничего не собрали — нет образа с тегом sha для этого коммита, деплоить нечего.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Нормализовать имя образа
        run: echo "IMAGE_BASE=${IMAGE_BASE,,}" >> "$GITHUB_ENV"

      - name: Подготовить SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Собрать .env для VPS
        run: |
          cat > .env.prod <<EOF
          POSTGRES_USER=${{ vars.POSTGRES_USER || 'hair_lab' }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ vars.POSTGRES_DB || 'hair_lab' }}
          GHCR_IMAGE_API=${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-api
          GHCR_IMAGE_WEB=${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-web
          IMAGE_TAG=${{ github.sha }}
          LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}
          SALON_TIMEZONE=${{ vars.NEXT_PUBLIC_SITE_TIMEZONE || 'Europe/Moscow' }}
          CORS_ORIGINS=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://strizhlab.ru' }}
          APP_URL=${{ vars.APP_URL || vars.NEXT_PUBLIC_SITE_URL || 'https://strizhlab.ru' }}

          # ЮKassa (тестовый магазин до запуска)
          PAYMENTS_MODE=${{ vars.PAYMENTS_MODE || 'test' }}
          YOOKASSA_SHOP_ID=${{ vars.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY=${{ secrets.YOOKASSA_SECRET_KEY }}
          YOOKASSA_RETURN_URL=${{ vars.YOOKASSA_RETURN_URL || '' }}
          YOOKASSA_VAT_CODE=${{ vars.YOOKASSA_VAT_CODE || '1' }}
          PAYMENT_RECEIPT_EMAIL=${{ vars.PAYMENT_RECEIPT_EMAIL || '' }}

          # Почта
          SMTP_HOST=${{ vars.SMTP_HOST || 'smtp.yandex.ru' }}
          SMTP_PORT=${{ vars.SMTP_PORT || '465' }}
          SMTP_SECURE=${{ vars.SMTP_SECURE || 'true' }}
          SMTP_USER=${{ vars.SMTP_USER || '' }}
          SMTP_FROM_EMAIL=${{ vars.SMTP_FROM_EMAIL || vars.SMTP_USER || '' }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_NAME=${{ vars.SMTP_FROM_NAME || vars.NEXT_PUBLIC_SITE_NAME || 'Стриж Lab' }}
          EOF

      - name: Выгрузить compose и .env на VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/hair-lab' }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$APP_DIR'"
          scp docker-compose.prod.yml .env.prod "$VPS_USER@$VPS_HOST:$APP_DIR/"
          ssh "$VPS_USER@$VPS_HOST" "mv '$APP_DIR/.env.prod' '$APP_DIR/.env'"

      - name: Обновить контейнеры
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/hair-lab' }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' GHCR_PAT='$GHCR_PAT' GHCR_USER='$GHCR_USER' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          if [ -n "${GHCR_PAT}" ]; then
            printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          fi
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          REMOTE
