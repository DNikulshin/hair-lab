name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Определяет, какие образы нужно пересобирать: docs-only push не должен гонять сборки.
  # Классификация — в scripts/changed-components.mjs, принцип консервативный.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
      any: ${{ steps.detect.outputs.any }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужна история: дифф считается от базовой ветки PR.
          fetch-depth: 0

      - id: detect
        run: node scripts/changed-components.mjs

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версия pnpm берётся из packageManager в package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Контракты собираются первыми: от них зависят типы приложений.
      - run: pnpm --filter @hair-lab/contracts build

      # Prisma Client генерируется из schema.prisma и нужен для типизации api.
      - run: pnpm --filter @hair-lab/api db:generate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:arch
      - run: pnpm test
      - run: pnpm format:check

  # Проверка Dockerfile на каждом PR: собираем только образы затронутых компонентов.
  #
  # ВАЖНО: матрица здесь статическая (оба компонента всегда в ней), а пропуск делается
  # на уровне шагов. Причина — required checks в branch protection: они привязаны к именам
  # `docker (api, apps/api/Dockerfile)` и `docker (web, apps/web/Dockerfile)`. Если job
  # пропустить целиком (`if` или динамическая матрица), эти имена никогда не отчитаются,
  # и PR навсегда получает «Expected — Waiting for status to be reported». Поэтому job
  # всегда создаёт оба чека, а неизменённый компонент просто не выполняет шаги.
  docker:
    runs-on: ubuntu-latest
    needs: [checks, changes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
    steps:
      # Решает, собирать ли этот компонент: значение приходит из job `changes`.
      - name: Определить, нужна ли сборка
        id: gate
        run: |
          if [ "${{ matrix.component }}" = "api" ]; then
            echo "run=${{ needs.changes.outputs.api }}" >> "$GITHUB_OUTPUT"
          else
            echo "run=${{ needs.changes.outputs.web }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Компонент не менялся — сборка пропущена
        if: steps.gate.outputs.run != 'true'
        run: |
          echo "Код ${{ matrix.component }} не менялся: сборка пропущена, чек остаётся зелёным"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.run == 'true'

      - uses: docker/build-push-action@v6
        if: steps.gate.outputs.run == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: hair-lab-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # Интеграционные тесты на реальном PostgreSQL: проверяют ограничения схемы
  # (EXCLUDE на пересечение слотов, FK, CHECK, unique).
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hair_lab
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: hair_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hair_lab -d hair_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hair_lab:change_me@localhost:5432/hair_lab?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @hair-lab/contracts build
      - run: pnpm --filter @hair-lab/api db:generate
      - run: pnpm --filter @hair-lab/api db:migrate:deploy
      - run: pnpm test:int
