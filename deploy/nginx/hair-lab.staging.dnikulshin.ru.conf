# Staging на этом хосте: hair-lab.dnikulshin.ru за nginx (контейнеры — только 127.0.0.1).
# Копируется в /etc/nginx/sites-available/ без правок:
#   sudo cp deploy/nginx/hair-lab.staging.dnikulshin.ru.conf \
#           /etc/nginx/sites-available/hair-lab-staging
#   sudo ln -sf /etc/nginx/sites-available/hair-lab-staging /etc/nginx/sites-enabled/hair-lab-staging
#   sudo nginx -t && sudo systemctl reload nginx
#
# Особенности хоста:
# - nginx слушает только 443; наружу проброшен 8443 → 443, поэтому публичный адрес —
#   https://hair-lab.dnikulshin.ru:8443 (порт вшивается в NEXT_PUBLIC_*, APP_URL, CORS_ORIGINS
#   и в адрес уведомлений ЮKassa: HTTPS 443/8443 провайдер принимает);
# - порт 80 на хосте не слушается и наружу не проброшен, поэтому блока `listen 80` и редиректа
#   с 80 на 443 здесь нет: он был бы недостижим;
# - сертификат — существующий wildcard `*.dnikulshin.ru`, для этого имени новый не нужен;
# - `map $http_upgrade $connection_upgrade` НЕ объявляется: он уже есть в
#   /etc/nginx/conf.d/dev.conf (тот подключается раньше sites-enabled, в том же http-контексте),
#   и держим единственное определение переменной без дублей. На хосте без dev.conf переменная
#   будет неизвестна (`nginx -t`: `unknown "connection_upgrade" variable`) — тогда `map`
#   объявляется в http-контексте один раз (например, в том же файле до `server`).
# - чужие Host отбивает `default_server` со `ssl_reject_handshake on` в том же dev.conf.

upstream hair_lab_staging_web {
    server 127.0.0.1:3010;
    keepalive 16;
}

upstream hair_lab_staging_api {
    server 127.0.0.1:3011;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hair-lab.dnikulshin.ru;

    ssl_certificate     /etc/ssl/dnikulshin/fullchain.pem;
    ssl_certificate_key /etc/ssl/dnikulshin/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hair_lab_staging:10m;
    ssl_session_timeout 1h;

    # Staging не индексируется.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # HSTS без includeSubDomains: основной домен отдаётся с GitHub Pages.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 4m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;

    # API: /api/health → 127.0.0.1:3011/health (префикс отрезается).
    location /api/ {
        proxy_pass http://hair_lab_staging_api/;
        proxy_http_version 1.1;
        # Сброс Connection обязателен: иначе nginx шлёт `Connection: close` и
        # `keepalive 16` в upstream не используется — соединение открывается заново.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Перезапись, а не дописывание: api доверяет X-Forwarded-For (trustProxy: true),
        # а по request.ip проверяется allowlist вебхука ЮKassa (ADR-0005).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Статика Next.js: имена файлов с хэшем, кэш агрессивный. add_header в location отменяет
    # унаследованные заголовки сервера, поэтому нужные повторяются здесь вручную.
    location /_next/static/ {
        proxy_pass http://hair_lab_staging_web;
        # Как в /api/: без HTTP/1.1 и сброса Connection keepalive к upstream не работает.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Next.js сам отдаёт Cache-Control для /_next/static — без hide_header add_header добавлял
        # второй заголовок (на staging в ответе было два cache-control).
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        proxy_pass http://hair_lab_staging_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        # $connection_upgrade объявлен в /etc/nginx/conf.d/dev.conf — здесь map не дублируем.
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
