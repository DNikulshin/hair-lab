# Preprod-контур на этом хосте: та же машина, отдельный стек (порты 3020/3021) и своя БД.
# Копируется в /etc/nginx/sites-available/ без правок:
#   sudo cp deploy/nginx/hair-lab.preprod.dnikulshin.ru.conf /etc/nginx/sites-available/hair-lab-preprod
#   sudo ln -sf /etc/nginx/sites-available/hair-lab-preprod /etc/nginx/sites-enabled/hair-lab-preprod
#   sudo nginx -t && sudo systemctl reload nginx
#
# Нужны: A-запись `preprod.dnikulshin.ru` на этот хост и проброс внешнего 8443 → 443 (уже есть).
# Сертификат — существующий wildcard `*.dnikulshin.ru`, отдельное имя не выпускается.
# Контур не индексируется и используется только для ручной проверки прод-пути (issue #139).
# `map $http_upgrade $connection_upgrade` объявляется в /etc/nginx/conf.d/dev.conf — не дублируем.

upstream hair_lab_preprod_web {
    server 127.0.0.1:3020;
    keepalive 16;
}

upstream hair_lab_preprod_api {
    server 127.0.0.1:3021;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name preprod.dnikulshin.ru;

    ssl_certificate     /etc/ssl/dnikulshin/fullchain.pem;
    ssl_certificate_key /etc/ssl/dnikulshin/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hair_lab_preprod:10m;
    ssl_session_timeout 1h;

    # Preprod не индексируется.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # HSTS без includeSubDomains: основной домен отдаётся с GitHub Pages.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 4m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;

    # API: /api/health → 127.0.0.1:3021/health (префикс отрезается).
    location /api/ {
        proxy_pass http://hair_lab_preprod_api/;
        proxy_http_version 1.1;
        # Сброс Connection обязателен: иначе nginx шлёт `Connection: close` и
        # `keepalive 16` в upstream не используется — соединение открывается заново.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Перезапись, а не дописывание: api доверяет X-Forwarded-For (trustProxy: true),
        # а по request.ip проверяется allowlist вебхука ЮKassa (ADR-0005).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Статика Next.js: имена файлов с хэшем, кэш агрессивный. add_header в location отменяет
    # унаследованные заголовки сервера, поэтому нужные повторяются здесь вручную.
    location /_next/static/ {
        proxy_pass http://hair_lab_preprod_web;
        # Как в /api/: без HTTP/1.1 и сброса Connection keepalive к upstream не работает.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Next.js сам отдаёт Cache-Control для /_next/static — без hide_header add_header добавлял
        # второй заголовок (на staging в ответе было два cache-control).
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        proxy_pass http://hair_lab_preprod_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        # $connection_upgrade объявлен в /etc/nginx/conf.d/dev.conf — здесь map не дублируем.
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
