# Отдельное имя проекта: не пересекается с docker-compose.prod.yml (name: hair-lab).
name: hair-lab-dev

# Локальная инфраструктура разработки. Прод-развёртывание описывается отдельно.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hair_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-hair_lab}
    # Только loopback (issue #124): dev-БД поднимается с паролем из шаблона окружения,
    # а Docker публикует порты в обход INPUT-цепочки ufw — с `0.0.0.0` база была бы
    # доступна всей локальной сети. Как у api/web в docker-compose.prod.yml.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
